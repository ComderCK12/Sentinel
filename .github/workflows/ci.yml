name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      # go.work's root isn't itself a module, so `./...` from here doesn't
      # resolve — build/vet each module go.work lists explicitly. Update
      # this list if go.work's `use` block changes (e.g. decision-service
      # gets scaffolded).
      - name: Build all services (workspace-aware)
        run: go build ./decision-service/... ./ingestion/... ./loadgen/... ./shared/... ./stream-processor/...

      - name: Vet
        run: go vet ./decision-service/... ./ingestion/... ./loadgen/... ./shared/... ./stream-processor/...

      # Same root-isn't-a-module issue as build/vet above: golangci-lint's
      # default `./...` doesn't resolve from the workspace root either, so
      # it needs the same explicit module list.
      # golangci-lint-action@v6's goinstall/binary paths are both hardcoded to
      # golangci-lint's pre-v2 Go module path (github.com/.../cmd/golangci-lint,
      # no /v2/) — confirmed in its bundled source, literally marked
      # "TODO: it should be updated for v2". With version: latest that silently
      # installs a v1.x binary, which then rejects our v2-schema .golangci.yml
      # ("additional properties 'version', 'formatters' not allowed"). v9 fixed
      # this (goinstall now targets .../v2/cmd/golangci-lint).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          # goinstall builds using the Go toolchain this workflow already set
          # up (1.26.6), instead of binary mode's prebuilt release asset which
          # may lag behind on the Go version it was built with.
          install-mode: goinstall
          args: --timeout=5m ./decision-service/... ./ingestion/... ./loadgen/... ./shared/... ./stream-processor/...

  python:
    name: Python lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-serving
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: model-serving/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Ruff lint
        run: ruff check .