name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go build & lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: |
            ingestion/go.sum
            stream-processor/go.sum
            decision-service/go.sum

      - name: Build all services (workspace-aware)
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  python:
    name: Python lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-serving
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: model-serving/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Ruff lint
        run: ruff check .